[package]
name = "validkit"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
description = "Typed newtypes for validated domain primitives — email, URL, cron, tenant, locale, and more"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/validkit"
keywords = ["validation", "email", "url", "cron", "newtype"]
categories = ["rust-patterns"]
exclude = ["/target"]

[workspace]
members = ["crates/validkit-derive"]
resolver = "2"

[dependencies]
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", features = ["serde"], optional = true }
regex = { version = "1", optional = true }
idna = { version = "1", optional = true }
validkit-derive = { version = "0.1.0", path = "crates/validkit-derive", optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
regex = "1"

[features]
default = ["std"]
std = ["thiserror/std", "serde?/std", "url?/std"]
serde = ["dep:serde", "dep:serde_json"]
# Deprecated no-op (kept for 1.x compatibility): chrono support never
# shipped — no code path references it. Do not add new dependencies on it.
chrono = []
url = ["dep:url"]
regex = ["dep:regex"]
openapi = []
derive = ["dep:validkit-derive"]
full = ["serde", "chrono", "url", "regex"]

[[bench]]
name = "valid_bench"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
